kind = "web"
previewPath = "/"
title = "Quest Buddies"
description = "A private two-player task and reward game where buddies plan, encourage, and progress together."
version = "1.0.0"
id = "artifacts/quest-road"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20223

[services.development]
run = "sh -c 'PORT=3000 pnpm --filter @workspace/api-server run dev & api_pid=$!; trap \"kill $api_pid\" EXIT INT TERM; until curl --fail --silent http://127.0.0.1:3000/api/healthz >/dev/null; do if ! kill -0 $api_pid 2>/dev/null; then wait $api_pid; exit 1; fi; sleep 1; done; pnpm --filter @workspace/quest-road run dev'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quest-road", "run", "build" ]
serve = "static"
publicDir = "artifacts/quest-road/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20223"
BASE_PATH = "/"
