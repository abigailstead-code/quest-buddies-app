kind = "web"
previewPath = "/"
title = "Quest Buddies"
description = "A private two-player task and reward game where buddies plan, encourage, and progress together."
version = "1.0.0"
id = "artifacts/quest-road"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20223

[services.development]
run = "pnpm --filter @workspace/quest-road run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quest-road", "run", "build" ]
serve = "static"
publicDir = "artifacts/quest-road/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20223"
BASE_PATH = "/"
