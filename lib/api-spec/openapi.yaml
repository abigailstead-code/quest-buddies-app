openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quest Road multiplayer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Shared multiplayer rooms
  - name: game
    description: Shared Quest Road game state
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a multiplayer room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInput"
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room by id
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a waiting room with its invite code
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomInput"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Room is full or invite code is incorrect
  /rooms/{roomId}/state:
    get:
      operationId: getGameState
      tags: [game]
      summary: Get the shared game state
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Shared game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: Room not found
  /rooms/{roomId}/bingo/{weekStart}:
    get:
      operationId: getBingoBoard
      tags: [game]
      summary: Get a weekly Journey Bingo board
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: weekStart
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Weekly Bingo board or locked future week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BingoBoard"
  /rooms/{roomId}/bingo/suggestions:
    post:
      operationId: suggestBingoSquare
      tags: [game]
      summary: Suggest a square for a future Bingo board
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BingoSuggestionInput"
      responses:
        "201":
          description: Saved suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BingoSuggestion"
  /rooms/{roomId}/quests:
    post:
      operationId: createQuest
      tags: [game]
      summary: Add a personal quest to a room
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestInput"
      responses:
        "201":
          description: Created quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
  /rooms/{roomId}/quests/{questId}:
    patch:
      operationId: updateQuest
      tags: [game]
      summary: Edit a personal quest
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestInput"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
    delete:
      operationId: deleteQuest
      tags: [game]
      summary: Delete a personal quest
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteQuestInput"
      responses:
        "204":
          description: Quest deleted
  /rooms/{roomId}/quests/{questId}/complete:
    post:
      operationId: setQuestCompleted
      tags: [game]
      summary: Complete or reopen a personal quest
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteQuestInput"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
  /rooms/{roomId}/quests/{questId}/reward:
    post:
      operationId: setQuestReward
      tags: [game]
      summary: Set the reward for another player's quest
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetQuestRewardInput"
      responses:
        "200":
          description: Updated quest reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          description: Invalid reward assignment
  /rooms/{roomId}/quests/{questId}/steal:
    post:
      operationId: stealQuestReward
      tags: [game]
      summary: Steal half of an eligible overdue quest reward
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/QuestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StealQuestRewardInput"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "400":
          description: Quest is not eligible to steal
  /rooms/{roomId}/encouragements:
    post:
      operationId: createEncouragement
      tags: [game]
      summary: Send a message to the other player
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEncouragementInput"
      responses:
        "201":
          description: Created encouragement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encouragement"
  /rooms/{roomId}/rewards:
    post:
      operationId: createReward
      tags: [game]
      summary: Create a shared reward
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRewardInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
  /rooms/{roomId}/rewards/{rewardId}/redeem:
    post:
      operationId: redeemReward
      tags: [game]
      summary: Redeem a reward with earned coins
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RewardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRewardInput"
      responses:
        "201":
          description: Created redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardRedemption"
        "400":
          description: Insufficient balance or unavailable reward
  /rooms/{roomId}/rewards/{rewardId}:
    patch:
      operationId: updateReward
      tags: [game]
      summary: Edit a shared reward
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RewardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRewardInput"
      responses:
        "200":
          description: Updated reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
    delete:
      operationId: deleteReward
      tags: [game]
      summary: Delete a shared reward
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RewardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRewardInput"
      responses:
        "204":
          description: Reward deleted
  /rooms/{roomId}/labels:
    post:
      operationId: createLabel
      tags: [game]
      summary: Create a personal quest label
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelInput"
      responses:
        "201":
          description: Created label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
  /rooms/{roomId}/labels/{labelId}:
    patch:
      operationId: updateLabel
      tags: [game]
      summary: Rename or recolour a personal quest label
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/LabelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLabelInput"
      responses:
        "200":
          description: Updated label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
    delete:
      operationId: deleteLabel
      tags: [game]
      summary: Delete a personal quest label
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/LabelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteLabelInput"
      responses:
        "204":
          description: Label deleted
  /rooms/{roomId}/reward-requests:
    post:
      operationId: createRewardRequest
      tags: [game]
      summary: Request a negotiated reward
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRewardRequestInput"
      responses:
        "201":
          description: Created reward request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardRequest"
  /rooms/{roomId}/reward-requests/{requestId}/respond:
    post:
      operationId: respondToRewardRequest
      tags: [game]
      summary: Respond to a negotiated reward request
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondRewardRequestInput"
      responses:
        "200":
          description: Updated reward request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardRequest"
        "400":
          description: Invalid negotiation action or insufficient balance
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        minLength: 4
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
    RewardId:
      name: rewardId
      in: path
      required: true
      schema:
        type: string
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Player:
      type: object
      required: [id, name, avatar, color, coins, xp, streak]
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: string }
        color: { type: string }
        coins: { type: number }
        xp: { type: number }
        streak: { type: number }
    Room:
      type: object
      required: [id, code, name, status, host, guest, createdAt]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [waiting, playing]
        host:
          $ref: "#/components/schemas/Player"
        guest:
          type: ["object", "null"]
          allOf:
            - $ref: "#/components/schemas/Player"
        createdAt: { type: string }
    QuestLink:
      type: object
      required: [id, url, name]
      properties:
        id: { type: string }
        url: { type: string, minLength: 1 }
        name: { type: string }
    QuestSubtask:
      type: object
      required: [id, title, completed]
      properties:
        id: { type: string }
        title: { type: string }
        completed: { type: boolean }
    Quest:
      type: object
      required: [id, ownerId, title, notes, dueDate, labelId, status, coinValue, rewardStatus, rewardAssignedBy, coinsAwarded, links, subtasks, stolenCoins, stolenBy, xpValue, createdAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        title: { type: string }
        notes: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        labelId: { type: ["string", "null"] }
        status:
          type: string
          enum: [planned, completed]
        coinValue: { type: ["number", "null"] }
        rewardStatus:
          type: string
          enum: [pending, assigned]
        rewardAssignedBy: { type: ["string", "null"] }
        coinsAwarded: { type: boolean }
        links:
          type: array
          items: { $ref: "#/components/schemas/QuestLink" }
        subtasks:
          type: array
          items: { $ref: "#/components/schemas/QuestSubtask" }
        stolenCoins: { type: number }
        stolenBy: { type: ["string", "null"] }
        xpValue: { type: number }
        completedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    Reward:
      type: object
      required: [id, title, description, emoji, cost, createdBy, active, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        emoji: { type: string }
        cost: { type: number }
        createdBy: { type: string }
        active: { type: boolean }
        createdAt: { type: string }
    Label:
      type: object
      required: [id, ownerId, name, color, createdAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        color: { type: string }
        createdAt: { type: string }
    RewardRequest:
      type: object
      required: [id, requesterId, responderId, payerId, turnPlayerId, title, description, offer, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        requesterId: { type: string }
        responderId: { type: string }
        payerId: { type: string }
        turnPlayerId: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        offer: { type: number }
        status:
          type: string
          enum: [awaiting_response, countered, accepted, declined, paid]
        createdAt: { type: string }
        updatedAt: { type: string }
    Encouragement:
      type: object
      required: [id, fromId, toId, message, createdAt]
      properties:
        id: { type: string }
        fromId: { type: string }
        toId: { type: string }
        message: { type: string }
        createdAt: { type: string }
    Transaction:
      type: object
      required: [id, playerId, amount, kind, label, createdAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        amount: { type: number }
        kind:
          type: string
          enum: [quest, reward, bonus]
        label: { type: string }
        createdAt: { type: string }
    RewardRedemption:
      type: object
      required: [id, rewardId, playerId, cost, redeemedAt]
      properties:
        id: { type: string }
        rewardId: { type: string }
        playerId: { type: string }
        cost: { type: number }
        redeemedAt: { type: string }
    GameState:
      type: object
      required: [room, players, quests, rewards, encouragements, transactions, redemptions, labels, rewardRequests, currentLevel, weekLabel, daysRemaining]
      properties:
        room: { $ref: "#/components/schemas/Room" }
        players:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        quests:
          type: array
          items: { $ref: "#/components/schemas/Quest" }
        rewards:
          type: array
          items: { $ref: "#/components/schemas/Reward" }
        encouragements:
          type: array
          items: { $ref: "#/components/schemas/Encouragement" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        redemptions:
          type: array
          items: { $ref: "#/components/schemas/RewardRedemption" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        rewardRequests:
          type: array
          items: { $ref: "#/components/schemas/RewardRequest" }
        currentLevel: { type: number }
        weekLabel: { type: string }
        daysRemaining: { type: number }
    BingoSquare:
      type: object
      required: [id, text, intensity, family, completed, completedAt, contributorIds]
      properties:
        id: { type: string }
        text: { type: string }
        intensity:
          type: string
          enum: [light, medium, stretch]
        family: { type: string }
        completed: { type: boolean }
        completedAt: { type: ["string", "null"] }
        contributorIds:
          type: array
          items: { type: string }
    BingoBoard:
      type: object
      required: [weekStart, weekLabel, status, squares, lineCount, lineBonusAwarded, threeLineBonusAwarded, fullBoardBonusAwarded]
      properties:
        weekStart: { type: string, format: date }
        weekLabel: { type: string }
        status:
          type: string
          enum: [active, past, locked]
        unlockDate: { type: ["string", "null"], format: date }
        squares:
          type: array
          items: { $ref: "#/components/schemas/BingoSquare" }
        lineCount: { type: number }
        lineBonusAwarded: { type: boolean }
        threeLineBonusAwarded: { type: boolean }
        fullBoardBonusAwarded: { type: boolean }
    BingoSuggestion:
      type: object
      required: [id, playerId, text, intensity, weekStart, createdAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        text: { type: string }
        intensity:
          type: string
          enum: [light, medium, stretch, undecided]
        weekStart: { type: string, format: date }
        createdAt: { type: string }
    BingoSuggestionInput:
      type: object
      required: [playerId, text]
      properties:
        playerId: { type: string }
        text: { type: string, minLength: 5, maxLength: 180 }
        intensity:
          type: string
          enum: [light, medium, stretch, undecided]
    CreateRoomInput:
      type: object
      required: [name, playerName]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        playerName: { type: string, minLength: 1, maxLength: 40 }
    JoinRoomInput:
      type: object
      required: [code, playerName]
      properties:
        code: { type: string, minLength: 4, maxLength: 12 }
        playerName: { type: string, minLength: 1, maxLength: 40 }
    CreateQuestInput:
      type: object
      required: [ownerId, title, dueDate]
      properties:
        ownerId: { type: string }
        title: { type: string, minLength: 1, maxLength: 180 }
        notes: { type: string, maxLength: 500 }
        dueDate: { type: ["string", "null"], format: date }
        labelId: { type: ["string", "null"] }
        links:
          type: array
          items: { $ref: "#/components/schemas/QuestLink" }
        subtasks:
          type: array
          items: { $ref: "#/components/schemas/QuestSubtask" }
    UpdateQuestInput:
      type: object
      properties:
        ownerId: { type: string }
        title: { type: string, minLength: 1, maxLength: 180 }
        notes: { type: string, maxLength: 500 }
        dueDate: { type: ["string", "null"], format: date }
        labelId: { type: ["string", "null"] }
        links:
          type: array
          items: { $ref: "#/components/schemas/QuestLink" }
        subtasks:
          type: array
          items: { $ref: "#/components/schemas/QuestSubtask" }
    DeleteQuestInput:
      type: object
      required: [ownerId]
      properties:
        ownerId: { type: string }
    CompleteQuestInput:
      type: object
      required: [ownerId, completed]
      properties:
        ownerId: { type: string }
        completed: { type: boolean }
    SetQuestRewardInput:
      type: object
      required: [actorId, coinValue]
      properties:
        actorId: { type: string }
        coinValue:
          type: number
          minimum: 1
    StealQuestRewardInput:
      type: object
      required: [actorId]
      properties:
        actorId: { type: string }
    CreateEncouragementInput:
      type: object
      required: [fromId, toId, message]
      properties:
        fromId: { type: string }
        toId: { type: string }
        message: { type: string, minLength: 1, maxLength: 300 }
    CreateRewardInput:
      type: object
      required: [createdBy, title, cost]
      properties:
        createdBy: { type: string }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        emoji: { type: string, maxLength: 4 }
        cost: { type: number, minimum: 1 }
    RedeemRewardInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: string }
    CreateLabelInput:
      type: object
      required: [ownerId, name, color]
      properties:
        ownerId: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, minLength: 4, maxLength: 24 }
    UpdateLabelInput:
      type: object
      required: [ownerId]
      properties:
        ownerId: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, minLength: 4, maxLength: 24 }
    DeleteLabelInput:
      type: object
      required: [ownerId]
      properties:
        ownerId: { type: string }
    UpdateRewardInput:
      type: object
      required: [actorId]
      properties:
        actorId: { type: string }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: ["string", "null"], maxLength: 300 }
        cost: { type: number, minimum: 1 }
    DeleteRewardInput:
      type: object
      required: [actorId]
      properties:
        actorId: { type: string }
    CreateRewardRequestInput:
      type: object
      required: [requesterId, title, offer]
      properties:
        requesterId: { type: string }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: ["string", "null"], maxLength: 300 }
        offer: { type: number, minimum: 1 }
    RespondRewardRequestInput:
      type: object
      required: [actorId, action]
      properties:
        actorId: { type: string }
        action:
          type: string
          enum: [accept, counter, decline, pay]
        offer: { type: number, minimum: 1 }

